name: WS diagnostic unit tests
on:
  push:
    branches: [feature/libregram-ws-settings]
    paths:
      - 'TMessagesProj/src/main/java/com/libregram/proxy/WsErrorClassifier.java'
      - 'tests/java/WsErrorClassifierTest.java'
      - '.github/workflows/ws-error-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mkdir -p build/ws-unit
          javac -d build/ws-unit TMessagesProj/src/main/java/com/libregram/proxy/WsErrorClassifier.java tests/java/WsErrorClassifierTest.java
          java -cp build/ws-unit WsErrorClassifierTest
