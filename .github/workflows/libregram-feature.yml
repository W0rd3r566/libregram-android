name: LibreGram feature APK

on:
  push:
    branches:
      - feature/libregram-ws-settings
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libregram-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check and install private build configuration
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import sys

          errors = []
          properties = os.environ.get('LOCAL_PROPERTIES', '')
          if not properties:
              errors.append('LOCAL_PROPERTIES secret is missing: provide base64 local.properties with your Telegram API credentials.')
          else:
              try:
                  decoded = base64.b64decode(properties, validate=True).decode('utf-8')
                  values = {}
                  for line in decoded.splitlines():
                      line = line.strip()
                      if line and not line.startswith(('#', '!')) and '=' in line:
                          key, value = line.split('=', 1)
                          values[key.strip()] = value.strip()
                  import re
                  if not re.fullmatch(r'[0-9]+', values.get('TELEGRAM_APP_ID', '')):
                      errors.append('LOCAL_PROPERTIES must contain a numeric TELEGRAM_APP_ID.')
                  if not re.fullmatch(r'[0-9a-fA-F]{32}', values.get('TELEGRAM_APP_HASH', '')):
                      errors.append('LOCAL_PROPERTIES must contain a valid TELEGRAM_APP_HASH.')
              except (ValueError, UnicodeError):
                  errors.append('LOCAL_PROPERTIES must be base64-encoded UTF-8 properties.')

          path = pathlib.Path('TMessagesProj/google-services.json')
          supplied = os.environ.get('GOOGLE_SERVICES_JSON', '')
          try:
              config = json.loads(supplied if supplied else path.read_text())
              packages = [client.get('client_info', {}).get('android_client_info', {}).get('package_name') for client in config.get('client', [])]
              if 'com.libregram.app' not in packages:
                  errors.append('Provide GOOGLE_SERVICES_JSON secret with the raw Firebase JSON registered for com.libregram.app. Do not edit the upstream package name.')
              elif supplied:
                  path.write_text(supplied)
          except (ValueError, OSError):
              errors.append('Firebase configuration is missing or invalid JSON.')

          for error in errors:
              print('::error::' + error)
          if errors:
              sys.exit(1)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Verify branding
        run: python3 .github/scripts/verify_libregram_branding.py
      - name: Build debug APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew :TMessagesProj:assembleDebug
      - name: Verify installable package
        shell: bash
        run: |
          APK=$(find TMessagesProj/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.libregram.app'"
      - uses: actions/upload-artifact@v4
        with:
          name: LibreGram-feature-debug-arm64
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
