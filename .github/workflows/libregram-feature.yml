name: LibreGram feature APK
on:
  push:
    branches: [feature/libregram-ws-settings]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: libregram-feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NATIVE_TARGET: arm64-v8a
      COMMIT_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Normalize private Telegram properties
        env:
          INPUT_LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: python3 .github/scripts/prepare_private_properties.py
      - name: Validate Firebase identity
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('TMessagesProj/google-services.json')
          text=os.environ.get('GOOGLE_SERVICES_JSON') or p.read_text()
          data=json.loads(text)
          assert any(c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='com.libregram.app' for c in data.get('client',[])), 'Wrong Firebase package'
          p.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare integrated alpha sources
        run: |
          python3 Tools/prepare-alpha.py
          python3 tests/test_libregram_controls.py
          python3 .github/scripts/verify_libregram_branding.py
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure environment
        run: |
          echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Build pinned WS JNI library and package license
        run: bash Tools/build-ws-proxy.sh
      - name: Restore optional signing identity
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > TMessagesProj/release.keystore
          fi
      - name: Build debug APK
        run: ./gradlew :TMessagesProj:assembleDebug
      - name: Verify APK package and native payload
        run: |
          APK=$(find TMessagesProj/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.libregram.app'"
          unzip -l "$APK" | grep -F lib/arm64-v8a/libtg_ws_proxy_jni.so
          unzip -l "$APK" | grep -F assets/licenses/tg-ws-proxy-rs-MIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LibreGram-APK-arm64-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
