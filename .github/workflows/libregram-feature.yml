name: LibreGram feature APK
on:
  push:
    branches: [feature/libregram-ws-settings]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: libregram-feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure environment
        run: |
          echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3.11)" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Build pinned WS JNI library and package license
        run: bash Tools/build-ws-proxy.sh
      - name: Upload native library for inspection
        uses: actions/upload-artifact@v4
        with:
          name: LibreGram-ws-native-arm64
          path: |
            TMessagesProj/jni/arm64-v8a/libtg_ws_proxy_jni.so
            TMessagesProj/src/main/assets/licenses/tg-ws-proxy-rs-MIT.txt
          if-no-files-found: error
      - name: Validate private APK configuration
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, sys
          errors = []
          try:
              raw = base64.b64decode(os.environ.get('LOCAL_PROPERTIES', ''), validate=True).decode()
              values = dict(line.split('=', 1) for line in raw.splitlines() if '=' in line and not line.lstrip().startswith(('#', '!')))
              if not re.fullmatch(r'[0-9]+', values.get('TELEGRAM_APP_ID', '').strip()):
                  errors.append('LOCAL_PROPERTIES requires TELEGRAM_APP_ID.')
              if not re.fullmatch(r'[0-9a-fA-F]{32}', values.get('TELEGRAM_APP_HASH', '').strip()):
                  errors.append('LOCAL_PROPERTIES requires TELEGRAM_APP_HASH.')
          except (ValueError, UnicodeError):
              errors.append('LOCAL_PROPERTIES must contain base64 UTF-8 properties.')
          path = pathlib.Path('TMessagesProj/google-services.json')
          supplied = os.environ.get('GOOGLE_SERVICES_JSON', '')
          try:
              config = json.loads(supplied or path.read_text())
              packages = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in config.get('client', [])]
              if 'com.libregram.app' not in packages:
                  errors.append('Provide raw Firebase JSON for com.libregram.app in GOOGLE_SERVICES_JSON.')
              elif supplied:
                  path.write_text(supplied)
          except (ValueError, OSError):
              errors.append('Firebase JSON is invalid.')
          for error in errors:
              print('::error::' + error)
          sys.exit(bool(errors))
          PY
      - name: Restore optional existing signing identity
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > TMessagesProj/release.keystore
          fi
      - name: Verify branding
        run: python3 .github/scripts/verify_libregram_branding.py
      - name: Build debug APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew :TMessagesProj:assembleDebug
      - name: Verify APK package and native payload
        run: |
          APK=$(find TMessagesProj/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.libregram.app'"
          unzip -l "$APK" | grep -F lib/arm64-v8a/libtg_ws_proxy_jni.so
          unzip -l "$APK" | grep -F assets/licenses/tg-ws-proxy-rs-MIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LibreGram-feature-debug-arm64
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
